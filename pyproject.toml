[project]
name = "physities"
version = "0.2.1"
description = "A Python library for representing and working with physical quantities and units"
authors = [{name = "M4tus4l3m", email = "lucas.sievers@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "physics",
    "units",
    "dimensional-analysis",
    "unit-conversion",
    "scientific-computing",
    "rust",
    "pyo3",
    "quantities",
    "measurements",
    "si-units",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/CenturyBoys/physities"
Documentation = "https://m4tus4l3m.github.io/physities/"
Repository = "https://github.com/CenturyBoys/physities"
Changelog = "https://github.com/CenturyBoys/physities/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/CenturyBoys/physities/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.9.0",
    "maturin>=1.0,<2.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-copybutton>=0.5.0",
]
all = [
    "physities[dev,benchmark,docs]",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "physities._physities_core"
python-source = "."

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F403", "F405", "E741", "W292", "I001", "F541", "F841", "E721"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
    "benchmark: benchmark tests",
]
addopts = "--cov=physities --cov-report=xml --cov-report=html"

[tool.coverage.run]
source = ["physities"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
