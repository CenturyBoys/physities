[project]
name = "physities"
version = "0.1.3"
description = "A Python library for representing and working with physical quantities and units"
authors = [{name = "M4tus4l3m", email = "lucas.sievers@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kobject>=0.6.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "maturin>=1.0,<2.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "physities._physities_core"
python-source = "."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F403", "F405", "E741", "W292", "I001", "F541", "F841", "E721"]

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests",
]
